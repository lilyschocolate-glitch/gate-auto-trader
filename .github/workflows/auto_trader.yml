name: Gate.io Daijunkan MACD Auto Trader

on:
  push:
    branches: [main]
  schedule:
    # 5分間隔でクラウド上から自動実行
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Daijunkan MACD Auto Trader
        env:
          GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
          GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
        run: |
          for i in 1 2 3 4; do
            python3 auto_trader.py
            if [ $i -lt 4 ]; then
              sleep 60
            fi
          done
