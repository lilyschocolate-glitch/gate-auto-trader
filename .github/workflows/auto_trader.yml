name: Gate.io Daijunkan MACD Auto Trader

on:
  push:
    branches: [main]
  schedule:
    # 大循環MACDの15分足・1時間足に合わせて定期チェック（1回あたり約5秒で完了する軽量設計）
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Daijunkan MACD Auto Trader
        env:
          GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
          GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
        run: python3 auto_trader.py
