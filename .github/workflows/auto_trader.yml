name: Gate.io Daijunkan MACD Auto Trader

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Daijunkan MACD Auto Trader
        env:
          GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
          GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
        run: |
          python3 -c '
          import os, traceback
          from daijunkan_macd import GateTrader
          from auto_trader import run_cycle
          key = os.environ.get("GATE_API_KEY", "")
          sec = os.environ.get("GATE_API_SECRET", "")
          with open("last_run_log.txt", "w") as f:
              f.write(f"KEY_LEN={len(key)} SEC_LEN={len(sec)}\n")
              try:
                  trader = GateTrader(key, sec)
                  run_cycle(trader)
                  f.write("SUCCESS\n")
              except Exception as e:
                  f.write(f"ERROR: {e}\n")
                  f.write(traceback.format_exc())
          '
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add last_run_log.txt
          git commit -m "Update run log [skip ci]" || true
          git push || true
